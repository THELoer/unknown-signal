[package]
name = "lethal-like-game"
version = "0.1.0"
edition = "2024"

[dependencies]
avian3d = "0.8.0"
bevy = "0.20.1"
lightyear = { version = "0.31.0", features = ["raw_connection", "udp"] }

# Bevy's unoptimized dev build can run at very low frame rates.
# Keep game code quick to rebuild while optimizing engine dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
